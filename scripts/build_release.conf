# build_release.sh 的定制配置, 改这里就够了, 不用动脚本本体。

# chroot 内 apt install 的包
APT_PACKAGES=(mosquitto alsa-utils ntp)

# apt-get 参数, 想省体积可加 --no-install-recommends
APT_OPTS="-y"

# 关闭的开机服务
DISABLE_SERVICES=(nginx sophliteos getty@tty1 ntp)

# 需要 mask 的服务。getty@tty1 由 systemd-getty-generator 每次启动动态生成,
# 只 disable 不生效, 必须 mask。
MASK_SERVICES=(getty@tty1)

# 需要额外开启的服务(默认为空)
ENABLE_SERVICES=()

# root 密码
ROOT_PASSWORD="aselsan"

# ---- 设备 DNS: 写进镜像, 设备开机后生效 ----
# 本镜像的 DNS 实际来自 /etc/netplan/01-netcfg.yaml 里每个网口的
# nameservers.addresses(默认 8.8.8.8), 所以这里会同时改两个地方:
#   1) netplan 各 ethernets 的 nameservers.addresses  <- 真正生效的
#   2) /etc/systemd/resolved.conf 的 [Resolve] DNS=   <- 全局兜底
# 留空 TARGET_DNS=() 表示完全不动镜像里现有的 DNS 配置。
TARGET_DNS=(8.8.8.8)

# 搜索域, 写进 resolved.conf 的 Domains=, 留空则不设置
TARGET_DNS_SEARCH=()

# ---- 构建期 DNS: 只给 chroot 里的 apt 用, 不会进镜像 ----
# 留空则沿用宿主机 /etc/resolv.conf, 一般不用改: chroot 与宿主共享网络
# 命名空间, 宿主的 127.0.0.x 解析器(Docker 的 127.0.0.11 / systemd-resolved
# 的 127.0.0.53)在 chroot 内同样能用。
# 只有当宿主 DNS 到不了 ports.ubuntu.com、apt-get update 报解析失败时,
# 才在这里填一个真实 DNS 绕过去, 例如 BUILD_DNS=(223.5.5.5 8.8.8.8)。
BUILD_DNS=()

# 默认打包类型, 可选 sdcard / usb / tftp, 可写多个
PKG_TYPES=(sdcard)
