{
  "debug": false,
  "log": "/mnt/app/log/appmon.log",
  "pid_file": "/var/run/appmon.pid",
  "serial_port": "/dev/ttyS6",
  "serial_baudrate": 115200,
  "serial_databits": 8,
  "serial_stopbits": 1,
  "serial_parity": 78,
  "programs": [
    {
      "appname": "nvrcore",
      "args": [
        {
          "key": "-l",
          "value": "2"
        }
      ],
      "cron": 0,
      "duration": 0,
      "env_params": [],
      "exepath": "/mnt/app/NvrCore",
      "softwdg": true
    },
    {
      "appname": "logrotate",
      "args": [
        {
          "key": "/mnt/app/configs/aselsan.conf"
        },
        {
          "key": "-s",
          "value": "/mnt/app/logrotate/logrotate.status"
        }
      ],
      "logfile": "/dev/null",
      "cron": 300,
      "duration": 0,
      "env_params": [],
      "exepath": "/mnt/tools/bin/logrotate",
      "softwdg": false
    },
    {
      "appname": "node_exporter",
      "logfile": "/dev/null",
      "cron": 0,
      "duration": 0,
      "env_params": [],
      "exepath": "/mnt/tools/bin/node_exporter",
      "softwdg": false
    }
  ]
}
