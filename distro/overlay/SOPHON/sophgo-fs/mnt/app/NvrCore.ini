[display]
hdmi_width=1920
hdmi_height=1080

[api]

apiDebug=1
secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
snapRoot=./www/snap/
defaultSnap=./www/logo.pn
[ffmpeg]
bin=/usr/bin/ffmpeg
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
snap=%s -i %s -y -f mjpeg -t 0.001 %s
log=./ffmpeg/ffmpeg.log
restart_sec=0

[general]
enableVhost=0
flowThreshold=1024
maxStreamWaitMS=15000
streamNoneReaderDelayMS=12000
addMuteAudio=0
resetWhenRePlay=1
publishToHls=0
publishToMP4=0
mergeWriteMS=0
modifyStamp=0
mediaServerId=your_server_id
enable_audio=1
hls_demand=0
rtsp_demand=0
rtmp_demand=0
ts_demand=0
fmp4_demand=0
wait_track_ready_ms=5000 
wait_add_track_ms=1000
unready_frame_cache=100
continue_push_ms=15000

[hls]
fileBufSize=65536
filePath=./www
segDur=2
segNum=3
segRetain=5
broadcastRecordTs=0
deleteDelaySec=0

[hook]
#admin_params=secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
#enable=0
#on_flow_report=https://127.0.0.1/index/hook/on_flow_report
#on_http_access=https://127.0.0.1/index/hook/on_http_access
#on_play=https://127.0.0.1/index/hook/on_play
#on_publish=https://127.0.0.1/index/hook/on_publish
#on_record_mp4=https://127.0.0.1/index/hook/on_record_mp4
#on_record_ts=https://127.0.0.1/index/hook/on_record_ts
#on_rtsp_auth=https://127.0.0.1/index/hook/on_rtsp_auth
#on_rtsp_realm=https://127.0.0.1/index/hook/on_rtsp_realm
#on_shell_login=https://127.0.0.1/index/hook/on_shell_login
#on_stream_changed=https://127.0.0.1/index/hook/on_stream_changed
#on_stream_none_reader=https://127.0.0.1/index/hook/on_stream_none_reader
#on_stream_not_found=https://127.0.0.1/index/hook/on_stream_not_found
#on_server_started=https://127.0.0.1/index/hook/on_server_started
#on_server_keepalive=https://127.0.0.1/index/hook/on_server_keepalive
#timeoutSec=10
#alive_interval=10.0

[cluster]
origin_url=
timeout_sec=15

[http]
charSet=utf-8
keepAliveSecond=30
maxReqSize=40960
notFound=<html><head><title>404 Not Found</title></head><body bgcolor="white"><center><h1>NOT FOUND FILE！</h1></center><hr></body></html>
prt=80
rootPath=./www
#http文件服务器读文件缓存大小，单位BYTE，调整该参数可以优化文件io性能
sendBufSize=65536
#https服务器监听端口
sslport=443
dirMenu=0  #don't show the dir  menu
virtualPath=record,/mnt/dev/record;pic,/mnt/dev/pic

[multicast]
addrMax=239.255.255.255
addrMin=239.0.0.0
udpTTL=64

[record]
appName=record
fileBufSize=65536
filePath=./www
fileSecond=3600
sampleMS=500
fastStart=0
fileRepeat=0

[rtmp]
handshakeSecond=15
keepAliveSecond=15
modifyStamp=0
port=1935
sslport=0

[rtp]
audioMtuSize=600
videoMtuSize=1400
rtpMaxSize=10

[rtp_proxy]
dumpDir=
port=10000
timeoutSec=15

[rtc]
timeoutSec=15
externIP=
port=8000
rembBitRate=0
preferredCodecA=PCMU,PCMA,opus,mpeg4-generic
preferredCodecV=H264,H265,AV1X,VP9,VP8

[rtsp]
authBasic=0
directProxy=1
handshakeSecond=15
keepAliveSecond=15
port=554
sslport=0

[shell]
maxReqSize=1024
port=0


